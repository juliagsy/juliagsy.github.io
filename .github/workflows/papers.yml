# Scrapes the latest AI/ML papers once a day and redeploys the site.
#
# Writes components/papers.json (consumed at build time by pages/tools/papers.tsx),
# commits it only when the papers actually changed, then reuses nextjs.yml to
# build and deploy. The commit SHA is passed through explicitly because a
# reusable workflow otherwise checks out the caller's SHA, which predates it.

name: Update latest papers

on:
  # 06:30 UTC daily — Hugging Face Daily Papers rolls over at 00:00 UTC
  schedule:
    - cron: "30 6 * * *"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Never let two scrapes race each other onto main
concurrency:
  group: "papers"
  cancel-in-progress: false

jobs:
  # Scrape job
  scrape:
    runs-on: ubuntu-latest
    # ~2.5 min normally (8 topics x 5 days, 3s apart as arXiv asks); this is the
    # backstop if their API degrades and every request burns its retries.
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch latest papers
        run: node scripts/fetch-papers.mjs
      - name: Commit updated papers
        id: commit
        run: |
          if git diff --quiet -- components/papers.json; then
            echo "components/papers.json unchanged, skipping deploy"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/papers.json
          git commit -m "chore(papers): update latest papers"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Deployment job — reuses the existing Pages build + deploy
  deploy:
    needs: scrape
    if: needs.scrape.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/nextjs.yml
    with:
      ref: ${{ needs.scrape.outputs.sha }}
